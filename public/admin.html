<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RavQA Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css"> <!-- Reuse existing styles -->
    <style>
        /* Admin Specific Overrides */
        body {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .auth-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--surface);
            border-radius: 16px;
            text-align: center;
        }

        .suggestion-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            border: 1px solid var(--border);
        }

        .diff-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .diff-header {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .badge-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .badge-relink {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
        }
    </style>
</head>

<body>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <div id="login-step" class="auth-box">
            <h2>🔒 Admin Login</h2>
            <p style="color:var(--text-muted); margin:10px 0 20px;">Accès sécurisé pour la validation.</p>
            <input type="password" id="password" placeholder="Mot de passe Admin">
            <button class="search-btn" onclick="requestLogin()" style="width:100%">Se connecter</button>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" style="display:none">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 40px;">
            <h1>🛡️ Admin Validation</h1>
            <button onclick="logout()"
                style="background:transparent; border:1px solid var(--border); color:var(--text-muted); padding: 8px 16px; border-radius:8px; cursor:pointer;">Déconnexion</button>
        </div>

        <div id="suggestions-list">
            <div style="text-align:center; color:var(--text-muted);">Chargement...</div>
        </div>

        <!-- Stats Section -->
        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>📈 Statistiques de Connexion</h3>
                <button class="admin-btn" onclick="triggerGDriveSync()" style="background:var(--warning); color:white;">
                    🔄 Backup GDrive
                </button>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <div
                    style="background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                    <div style="font-size: 0.9em; color: var(--text-muted);">Visiteurs Aujourd'hui</div>
                    <div id="stat-today" style="font-size: 2em; font-weight: bold;">-</div>
                </div>
                <div
                    style="background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                    <div style="font-size: 0.9em; color: var(--text-muted);">Total Visiteurs</div>
                    <div id="stat-total" style="font-size: 2em; font-weight: bold;">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/auth';
        let token = localStorage.getItem('admin_token');

        if (token) {
            showDashboard();
        }

        async function requestLogin() {
            const password = document.getElementById('password').value;
            if (!password) return alert('Mot de passe requis');

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    showDashboard();
                } else {
                    alert('Erreur: ' + data.error);
                }
            } catch (e) { alert('Erreur réseau'); }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }

        async function showDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadSuggestions();
            loadVisitorStats();
        }

        async function loadVisitorStats() {
            try {
                const res = await fetch('/api/admin/visits');
                const data = await res.json();
                document.getElementById('stat-today').textContent = data.today;
                document.getElementById('stat-total').textContent = data.total;
            } catch (e) {
                console.error('Stats error:', e);
            }
        }

        async function loadSuggestions() {
            try {
                const res = await fetch('/api/admin/suggestions', {
                    headers: { 'x-admin-token': token }
                });
                if (res.status === 403) return logout();
                const data = await res.json();
                renderSuggestions(data.suggestions);
            } catch (e) { console.error(e); }
        }

        function renderSuggestions(list) {
            const container = document.getElementById('suggestions-list');
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:50px;">Aucune suggestion en attente. 🎉</div>';
                return;
            }

            container.innerHTML = list.map(s => {
                const payload = JSON.parse(s.payload);
                let contentHTML = '';

                if (s.type === 'edit') {
                    contentHTML = `
                        <div>
                            <div class="diff-header">Actuel</div>
                            <div class="diff-box" style="opacity:0.6">${s.current_question || '?'}</div>
                            <div class="diff-header" style="margin-top:10px">Nouveau (Proposé)</div>
                            <div class="diff-box" style="border:1px solid #3b82f6;">${payload.question}</div>
                        </div>
                        <div>
                            <div class="diff-header">Actuel (Réponse)</div>
                            <div class="diff-box" style="opacity:0.6">${(s.current_answer || '').substring(0, 100)}...</div>
                            <div class="diff-header" style="margin-top:10px">Nouveau (Réponse)</div>
                            <div class="diff-box" style="border:1px solid #3b82f6;">${(payload.answer || '').substring(0, 100)}...</div>
                        </div>
                    `;
                } else if (s.type === 'delete') {
                    contentHTML = `
                        <div style="grid-column: span 2">
                            <div class="diff-header">Message à supprimer</div>
                            <div class="diff-box" style="border:1px solid #ef4444;">${s.current_question}</div>
                            <div style="margin-top:5px; color:#ef4444;">⚠️ Cette action masquera le message définitivement.</div>
                        </div>
                    `;
                }

                const isDelete = s.type === 'delete';
                const cardStyle = isDelete ? 'border: 1px solid rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.05);' : '';
                const btnText = isDelete ? '🗑️ Confirmer Suppression' : '✅ Valider';
                const btnStyle = isDelete ? 'background:#ef4444;' : 'background:#10b981;';

                return `
                    <div class="suggestion-card" style="${cardStyle}">
                        <div style="grid-column: span 2; display:flex; gap:10px; align-items:center;">
                            <span class="badge badge-${s.type}">${s.type}</span>
                            <span style="color:var(--text-muted); font-size:0.9em;">Il y a ${Math.floor((Date.now() / 1000 - s.created_at) / 60)} min • IP: ${s.suggester_ip}</span>
                        </div>
                        ${contentHTML}
                        <div class="actions">
                            <button onclick="approve(${s.id})" style="${btnStyle} border:none; color:white; padding:8px 16px; border-radius:6px; cursor:pointer;">${btnText}</button>
                            <button onclick="reject(${s.id})" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-muted); padding:8px 16px; border-radius:6px; cursor:pointer;">Refuser</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function approve(id) {
            if (!confirm('Valider cette modification ?')) return;
            const res = await fetch(`/api/admin/suggestions/${id}/approve`, {
                method: 'POST',
                headers: { 'x-admin-token': token }
            });
            if (res.ok) loadSuggestions();
        }

        async function reject(id) {
            if (!confirm('Refuser cette modification ?')) return;
            const res = await fetch(`/api/admin/suggestions/${id}/reject`, {
                method: 'POST',
                headers: { 'x-admin-token': token }
            });
            if (res.ok) loadSuggestions();
        }
        async function triggerGDriveSync() {
            if (!confirm('⚠️ Attention : Ne lancez ceci que si les audios ne marchent pas !\nCela va télécharger ~5Go depuis Google Drive.\n\nContinuer ?')) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerText = '⏳ Lancement...';

            try {
                const res = await fetch('/api/debug/sync-gdrive', {
                    method: 'POST',
                    headers: { 'x-admin-token': localStorage.getItem('admin_token') }
                });
                const data = await res.json();
                alert('✅ ' + data.message);
            } catch (e) {
                alert('❌ Erreur: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '🔄 Sync Audio (Backup GDrive)';
            }
        }
    </script>
</body>

</html>
